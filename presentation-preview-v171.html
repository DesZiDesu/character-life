<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Life — Presentation Pack Preview</title>
<link rel="stylesheet" href="./style.css">
<style>
:root{color-scheme:dark;--SmartThemeBodyColor:#eeeae2;--SmartThemeBlurTintColor:#111216;--cl-portrait-size:72px;--cl-chat-font-size:90%;--cl-chat-block-gap:5px;--cl-chat-content-gap:6px;--cl-chat-pad-y:10px;--cl-chat-pad-x:14px;--cl-chat-header-pad:8px;--cl-chat-header-gap:11px;--cl-chat-header-extra:16px}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,34px);background:#0d0e11;color:#eeeae2;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(1180px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;padding-bottom:16px;border-bottom:1px solid #34363d}.top small{opacity:.62;letter-spacing:.12em}.top h1{margin:4px 0 0;font-size:clamp(1.3rem,4vw,2.1rem)}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:10px;margin:16px 0}.controls label{display:grid;gap:5px;font-size:.8rem;opacity:.82}.controls select{min-height:36px;background:#191b20;color:#eee;border:1px solid #3b3e46}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{min-width:0;padding:14px;background:#121318;border:1px solid #30323a;overflow:hidden}.card>header{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;opacity:.72}.card>header b{color:#fff}.mes_text{width:100%;--cl-block-width:100%;--cl-content-rail:100%}.cl-chat-profile-details{margin-top:6px;font-size:.72em}.cl-chat-profile-details summary{cursor:pointer;color:var(--cl-local-header);letter-spacing:.07em;text-transform:uppercase}.cl-chat-profile-grid{display:grid;gap:4px;margin-top:7px;padding:8px;border:1px solid color-mix(in srgb,var(--cl-local-header) 18%,transparent)}.cl-chat-profile-grid>div{display:grid;grid-template-columns:88px 1fr;gap:8px}.cl-chat-profile-grid strong{color:var(--cl-local-header)}.cl-chat-profile-grid span{white-space:normal;color:#c7c8cc}
/* Requested Manga refinements */
.mes_text[data-cl-design^="manga-"][data-cl-position="left"] .cl-chat-identity{text-align:left;justify-items:start}.mes_text[data-cl-design^="manga-"][data-cl-position="center"] .cl-chat-identity{text-align:center;justify-items:center}.mes_text[data-cl-design^="manga-"][data-cl-position="right"] .cl-chat-identity{text-align:right;justify-items:end}.mes_text[data-cl-design^="manga-"][data-cl-position="left"] .cl-chat-meta{justify-content:flex-start}.mes_text[data-cl-design^="manga-"][data-cl-position="center"] .cl-chat-meta{justify-content:center}.mes_text[data-cl-design^="manga-"][data-cl-position="right"] .cl-chat-meta{justify-content:flex-end}.mes_text[data-cl-design="manga-light"] .cl-chat-header-core{position:relative;padding:12px 14px;border:1px solid color-mix(in srgb,var(--cl-local-header) 42%,#d6c69b 28%);background:transparent}.mes_text[data-cl-design="manga-light"] .cl-chat-thought{color:#eee8d9;background:transparent;border:1px solid color-mix(in srgb,var(--cl-local-thought) 42%,#d7c8a2 30%);border-left:3px solid var(--cl-local-thought)}.mes_text[data-cl-design="manga-light"] .cl-chat-dialogue{color:#eee;background:linear-gradient(90deg,color-mix(in srgb,var(--cl-local-dialogue) 5%,transparent),transparent 55%);border:1px solid color-mix(in srgb,var(--cl-local-dialogue) 34%,#d8c99e 18%);border-left:4px solid var(--cl-local-dialogue);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}.mes_text[data-cl-design="manga-noir"] .cl-chat-portrait{order:0;background:#0d0e11}.mes_text[data-cl-design="manga-noir"] .cl-chat-identity{order:1}.mes_text[data-cl-design="manga-noir"] .cl-chat-header-core{position:relative;padding:12px 14px;border:1px solid #4b4d55;background:transparent}.mes_text[data-cl-design="manga-noir"] .cl-chat-header-core:before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:3px;background:var(--cl-local-header)}.mes_text[data-cl-design="manga-noir"] .cl-chat-thought{color:#eee;background:transparent;border:1px solid #484a52;border-left:3px solid var(--cl-local-thought)}.mes_text[data-cl-design="manga-noir"] .cl-chat-dialogue{color:#eee;background:linear-gradient(90deg,color-mix(in srgb,var(--cl-local-dialogue) 5%,transparent),transparent 60%);border:1px solid #444750;border-left:4px solid var(--cl-local-dialogue);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
/* Tactical Vector */
.preview-tactical .cl-chat-wing,.preview-arcane .cl-chat-wing{display:none}.preview-tactical .cl-chat-header-core{position:relative;width:100%;padding:12px 14px;border:1px solid color-mix(in srgb,var(--cl-local-header) 64%,transparent);border-left:4px solid var(--cl-local-header);background:transparent;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}.preview-tactical .cl-chat-header-core:after{content:'';position:absolute;right:14px;top:8px;width:44px;height:3px;background:linear-gradient(90deg,transparent,var(--cl-local-header))}.preview-tactical .cl-chat-name{font-weight:760;letter-spacing:.07em;text-transform:uppercase}.preview-tactical .cl-chat-rule{display:block;width:150px;height:2px;background:linear-gradient(90deg,var(--cl-local-header),transparent)}.preview-tactical .cl-chat-thought{background:transparent;border:1px solid color-mix(in srgb,var(--cl-local-thought) 52%,transparent);border-left:4px solid var(--cl-local-thought);clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,0 100%)}.preview-tactical .cl-chat-dialogue{background:linear-gradient(90deg,color-mix(in srgb,var(--cl-local-dialogue) 7%,transparent),transparent 58%);border:1px solid color-mix(in srgb,var(--cl-local-dialogue) 42%,transparent);border-bottom:3px solid var(--cl-local-dialogue);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
/* Arcane Regalia */
.preview-arcane .cl-chat-header-core{position:relative;width:100%;padding:14px 16px;border:1px solid color-mix(in srgb,var(--cl-local-header) 50%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--cl-local-header) 5%,transparent),transparent 35%,color-mix(in srgb,var(--cl-local-header) 4%,transparent));box-shadow:inset 0 0 22px rgba(0,0,0,.2)}.preview-arcane .cl-chat-header-core:before{content:'';position:absolute;inset:5px;border-top:1px solid color-mix(in srgb,var(--cl-local-header) 24%,transparent);border-bottom:1px solid color-mix(in srgb,var(--cl-local-header) 18%,transparent)}.preview-arcane .cl-chat-portrait{border:1px solid color-mix(in srgb,var(--cl-local-header) 78%,#d8bd78 22%);box-shadow:0 0 0 3px color-mix(in srgb,var(--cl-local-header) 10%,transparent),0 0 18px color-mix(in srgb,var(--cl-local-header) 14%,transparent)}.preview-arcane .cl-chat-rule{display:block;width:74px;height:1px;background:linear-gradient(90deg,transparent,var(--cl-local-header),transparent)}.preview-arcane .cl-chat-thought{background:transparent;border:1px solid color-mix(in srgb,var(--cl-local-thought) 34%,#a98b56 16%)}.preview-arcane .cl-chat-dialogue{background:linear-gradient(90deg,color-mix(in srgb,var(--cl-local-dialogue) 4%,transparent),transparent 62%);border:1px solid color-mix(in srgb,var(--cl-local-dialogue) 34%,#8f7650 16%);border-left:3px solid var(--cl-local-dialogue)}
@media(max-width:760px){body{padding:10px}.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.controls{grid-template-columns:1fr 1fr}.card{padding:10px}.cl-chat-profile-grid>div{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><header class="top"><div><small>Character Life's v1.7.1</small><h1>Presentation Pack Preview</h1></div><small>Manga refresh + 2 new designs</small></header><section class="controls"><label>Header alignment<select id="align"><option value="left">Left</option><option value="center" selected>Middle</option><option value="right">Right</option></select></label><label>Portrait shape<select id="shape"><option value="square">Square</option><option value="rounded" selected>Rounded</option><option value="portrait">Portrait</option><option value="circle">Circle</option><option value="hexagon">Hexagon</option></select></label></section><section class="grid" id="grid"></section></main>
<script>
const themes=[['Manga Light','manga-light','Warm transparent editorial frame','#d6bd77','#aa86c8','#d6bd77',''],['Manga Noir','manga-noir','Dark transparent editorial frame','#8e82ba','#9b72c7','#887cc2',''],['Tactical Vector','clean','Angular HUD / status-system language','#4ee2d0','#b665e8','#54d9ff','preview-tactical'],['Arcane Regalia','clean','Dark luxury / fantasy-system language','#c4a268','#ad7fa8','#c49a5c','preview-arcane']];
const grid=document.getElementById('grid');
function blocks(t){const [name,design,note,h,t,d,cls]=t;return `<article class="card"><header><b>${name}</b><span>${note}</span></header><div class="mes_text character-life-rendered ${cls}" data-cl-design="${design}" data-cl-position="center" data-cl-shape="rounded" data-cl-missing="empty"><section class="cl-chat-block cl-chat-thought" style="--cl-local-thought:${t}"><div class="cl-chat-label"><span></span><strong>Seraphine</strong><i>•</i><em>Thought</em></div><div class="cl-chat-content">The seal reacted before anyone touched it. Someone else is already inside.</div></section><section class="cl-chat-block cl-chat-header" data-cl-name="Seraphine Vale" style="--cl-local-header:${h}"><div class="cl-chat-wing left"><i></i><span></span></div><div class="cl-chat-header-core"><div class="cl-chat-portrait"><span class="cl-chat-initial">SV</span><b class="tl"></b><b class="br"></b></div><div class="cl-chat-identity"><small class="cl-chat-role">National Hunter · Arcane Analyst</small><i class="cl-chat-rule"></i><strong class="cl-chat-name">Seraphine Vale</strong><div class="cl-chat-meta"><span>Vanguard Association</span><span>she/her</span><span>Woman</span><span>Age 29</span><span>Human</span></div><details class="cl-chat-profile-details"><summary>Character profile</summary><div class="cl-chat-profile-grid"><div><strong>Appearance</strong><span>Silver hair, amber eyes, formal field uniform.</span></div><div><strong>Personality</strong><span>Controlled, observant, dry sense of humor.</span></div><div><strong>Abilities</strong><span>Barrier analysis, rune disruption, close-range spellcraft.</span></div><div><strong>Current state</strong><span>Investigating an unstable red-gate transition.</span></div></div></details></div></div><div class="cl-chat-wing right"><i></i><span></span></div></section><section class="cl-chat-block cl-chat-dialogue" style="--cl-local-dialogue:${d}"><div class="cl-chat-label"><span></span><strong>Seraphine</strong><i>•</i><em>Dialogue #1</em></div><div class="cl-chat-content">Keep the gate clear. If that pattern changes again, we evacuate the entire floor.</div></section></div></article>`}
grid.innerHTML=themes.map(blocks).join('');const previews=[...document.querySelectorAll('.mes_text')];document.getElementById('align').onchange=e=>previews.forEach(p=>p.dataset.clPosition=e.target.value);document.getElementById('shape').onchange=e=>previews.forEach(p=>p.dataset.clShape=e.target.value);
</script></body></html>
